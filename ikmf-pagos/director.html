<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="title.director">Panel de país — IKMF Pagos</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="director">
<main class="container">
  <div class="page-head">
    <div>
      <h1 id="title" data-i18n="dir.title">Panel de país</h1>
      <p id="subtitle"></p>
    </div>
    <div class="row">
      <select class="input hidden" id="country-select" style="width:auto"></select>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button type="button" data-tab="month" class="active" data-i18n="dir.tab_month">Pagos del mes</button>
    <button type="button" data-tab="pending"><span data-i18n="dir.tab_pending">Por validar</span> <span class="badge hidden" id="pending-badge"></span></button>
    <button type="button" data-tab="instructors"><span data-i18n="dir.tab_instructors">Instructores</span> <span class="badge hidden" id="inactive-badge"></span></button>
  </div>

  <!-- Pagos del mes -->
  <section id="tab-month">
    <div class="row" style="margin-bottom:16px">
      <button class="btn ghost sm flip" id="prev-month" type="button">‹</button>
      <input class="input" id="month-input" type="month" style="width:auto" />
      <button class="btn ghost sm flip" id="next-month" type="button">›</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="export-btn" type="button" data-i18n="dir.export">Exportar CSV</button>
    </div>
    <div class="stats" id="month-stats"></div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="col.instructor">Instructor</th>
              <th data-i18n="col.status">Estado</th>
              <th class="num" data-i18n="col.fee">Cuota</th>
              <th class="num" data-i18n="col.paid">Pagado</th>
              <th data-i18n="col.date">Fecha</th>
              <th class="num" data-i18n="col.due_months">Meses adeudados</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="month-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Por validar -->
  <section id="tab-pending" class="hidden">
    <div class="card">
      <div class="card-head">
        <h2 id="pending-title"></h2>
        <span class="sub" data-i18n="dir.pending_sub"></span>
      </div>
      <div id="pending-note"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="col.instructor">Instructor</th>
              <th class="admin-only hidden" data-i18n="common.country">País</th>
              <th data-i18n="col.month">Mes</th>
              <th class="num" data-i18n="col.amount">Monto</th>
              <th data-i18n="col.paid_on">Pagado el</th>
              <th data-i18n="col.method">Medio</th>
              <th data-i18n="col.sent">Enviado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="pending-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Instructores -->
  <section id="tab-instructors" class="hidden">
    <div class="row" style="margin-bottom:16px">
      <button class="btn primary" id="new-user-btn" type="button" data-i18n="dir.new_instructor">+ Nuevo instructor</button>
      <span class="spacer"></span>
      <label class="sub row" style="gap:6px"><input type="checkbox" id="show-left" /> <span data-i18n="dir.show_left">Mostrar dados de baja</span></label>
    </div>
    <p class="sub" id="fee-note" style="margin:-4px 0 16px"></p>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-i18n="col.instructor">Instructor</th>
              <th data-i18n="col.contact">Contacto</th>
              <th data-i18n="col.status">Estado</th>
              <th class="num" data-i18n="col.fee">Cuota</th>
              <th data-i18n="col.start">Cobrar desde</th>
              <th class="num" data-i18n="col.owes">Adeuda</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="instructors-body"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/common.js"></script>
<script src="js/director.js"></script>
</body>
</html>
