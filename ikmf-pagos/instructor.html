<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="title.instructor">Mis pagos — IKMF Pagos</title>
<link rel="stylesheet" href="css/style.css?v=20261031c" />
</head>
<body data-page="instructor">
<main class="container">
  <div class="page-head">
    <div>
      <h1 data-i18n="inst.title">Mis pagos</h1>
      <p id="fee-line" data-i18n="inst.loading">Cargando…</p>
    </div>
    <button class="btn primary" id="new-payment-btn" type="button" data-i18n="inst.new">+ Cargar pago</button>
  </div>

  <div id="banner"></div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="card-head">
      <h2 data-i18n="inst.month_by_month">Mes por mes</h2>
      <span class="sub" data-i18n="inst.validated_by"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-i18n="col.month">Mes</th>
            <th data-i18n="col.status">Estado</th>
            <th class="num" data-i18n="col.amount">Monto</th>
            <th data-i18n="col.paid_on">Pagado el</th>
            <th data-i18n="col.detail">Detalle</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="months-body"><tr><td colspan="6" class="empty" data-i18n="inst.loading">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=20261031c"></script>
<script src="js/i18n.js?v=20261031c"></script>
<script src="js/common.js?v=20261031c"></script>
<script src="js/instructor.js?v=20261031c"></script>
</body>
</html>
