<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="title.login">Ingresar — IKMF Pagos</title>
<link rel="stylesheet" href="css/style.css?v=20261031d" />
</head>
<body data-page="login">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-lang" id="lang-slot"></div>
    <div class="auth-logo">
      <span class="brand-mark">IK</span>
      <h1 data-i18n="app.name">IKMF Pagos</h1>
      <p data-i18n="app.tagline">Control de cuotas mensuales de instructores</p>
    </div>

    <div class="card">
      <div class="tabs" id="mode-tabs">
        <button type="button" data-mode="login" class="active" data-i18n="login.tab_login">Ingresar</button>
        <button type="button" data-mode="signup" data-i18n="login.tab_signup">Crear cuenta</button>
      </div>

      <div id="msg" class="banner hidden"></div>

      <form id="auth-form" novalidate>
        <div class="signup-only hidden">
          <div class="field">
            <label for="f-name" data-i18n="login.name">Nombre y apellido</label>
            <input class="input" id="f-name" autocomplete="name" />
          </div>
          <div class="field">
            <label for="f-country" data-i18n="login.country">País</label>
            <select class="input" id="f-country"><option value="" data-i18n="login.loading_countries">Cargando…</option></select>
          </div>
          <div class="field">
            <label for="f-phone" data-i18n="login.phone_opt">Teléfono (opcional)</label>
            <input class="input" id="f-phone" type="tel" dir="ltr" autocomplete="tel" />
          </div>
        </div>

        <div class="field email-field">
          <label for="f-email" data-i18n="common.email">Email</label>
          <input class="input" id="f-email" type="email" dir="ltr" autocomplete="email" required />
        </div>
        <div class="field password-field">
          <label for="f-password" id="password-label" data-i18n="login.password">Contraseña</label>
          <input class="input" id="f-password" type="password" dir="ltr" autocomplete="current-password" minlength="8" required />
        </div>
        <label class="remember-row" id="remember-row">
          <input type="checkbox" id="f-remember" checked />
          <span data-i18n="login.remember">Recordarme</span>
        </label>

        <button class="btn primary block" id="submit-btn" type="submit" data-i18n="login.btn_login">Ingresar</button>
      </form>

      <p class="sub" style="text-align:center; margin:14px 0 0;">
        <a href="#" id="forgot-link" data-i18n="login.forgot">¿Olvidaste tu contraseña?</a>
      </p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/config.js?v=20261031d"></script>
<script src="js/i18n.js?v=20261031d"></script>
<script src="js/common.js?v=20261031d"></script>
<script src="js/login.js?v=20261031d"></script>
</body>
</html>
