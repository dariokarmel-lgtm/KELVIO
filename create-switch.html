<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nuevo switch — KALVIO</title>
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="create">
<div class="phone">
  <header class="app-header with-border">
    <a class="back-link" href="index.html" data-i18n-attr="aria-label:aria.back">←</a>
    <img class="brand-icon" src="img/kalvio-icon-256.png" alt="" />
    <div class="flex-1"><h1 id="header-title">Nuevo switch</h1></div>
  </header>

  <main class="app-main" id="main"></main>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
let selectedMode = null;

function render() {
  const db = loadDB();
  const atFreeLimit = db.account.plan === "free" && db.switches.length >= 1;

  qs("#main").innerHTML = `
    <p class="eyebrow">${t("create.step")}</p>
    <h2 style="margin:0 0 4px;">${t("create.title")}</h2>
    <p class="text-sm muted" style="margin:0 0 18px;">${t("create.subtitle")}</p>

    ${atFreeLimit ? `
      <div class="warn-banner">
        💎 ${t("create.paywall", { pro: `<b>${t("create.pro")}</b>` })}
        <a href="#" onclick="event.preventDefault(); showToast(t('create.toast_plans_pending'))">${t("create.view_plans")}</a>.
      </div>
    ` : ""}

    <button class="mode-card ${selectedMode === "legado" ? "selected" : ""}" onclick="pick('legado')">
      <p class="mode-title">${t("create.mode_legado_title")}</p>
      <p class="mode-desc">${t("create.mode_legado_desc")}</p>
    </button>

    <button class="mode-card ${selectedMode === "sesion" ? "selected" : ""}" onclick="pick('sesion')">
      <p class="mode-title">${t("create.mode_cuidame_title")}</p>
      <p class="mode-desc">${t("create.mode_cuidame_desc")}</p>
    </button>

    <button class="btn btn-primary mt-16" id="continue-btn" ${selectedMode ? "" : "disabled"}>${t("common.continue")}</button>
    ${atFreeLimit ? `<p class="text-sm muted text-center mt-8">${t("create.demo_bypass")}</p>` : ""}
  `;

  const cont = qs("#continue-btn");
  if (cont) cont.onclick = () => {
    if (!selectedMode) return;
    location.href = `configure-switch.html?new=1&mode=${selectedMode}`;
  };
}

function pick(mode) {
  selectedMode = mode;
  render();
}

qs("#header-title").textContent = t("create.header_title");
render();
</script>
</body>
</html>
