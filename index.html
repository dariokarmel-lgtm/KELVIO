<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inicio — KALVIO</title>
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
<div class="phone">

  <header class="app-header">
    <img class="brand-icon" src="img/kalvio-icon-256.png" alt="" />
    <div class="flex-1">
      <h1>KALVIO <span class="subtitle">Safety switch &amp; panic button</span></h1>
    </div>
    <a class="gear-link" href="settings.html" aria-label="Ajustes">⚙️</a>
  </header>

  <main class="app-main" id="main"></main>

  <button class="fab" title="Nuevo switch" onclick="location.href='create-switch.html'">+</button>

  <nav class="bottom-nav">
    <a data-nav="home" href="index.html"><span class="icon">🏠</span>Inicio</a>
    <a data-nav="recipients" href="recipients.html"><span class="icon">👥</span>Destinatarios</a>
    <a data-nav="history" href="history.html"><span class="icon">🕘</span>Historial</a>
    <a data-nav="settings" href="settings.html"><span class="icon">⚙️</span>Ajustes</a>
  </nav>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function render() {
  const switches = getSwitches();
  const main = qs("#main");
  const activeSwitches = switches.filter((s) => !s.off);

  let html = "";

  if (activeSwitches.length > 0) {
    html += `
      <button class="panic-hero" id="panic-hero-btn">
        <span class="panic-icon">🚨</span>
        <span>
          <p class="panic-title">Botón de pánico</p>
          <p class="panic-sub">Avisa ya a tus contactos en todos tus switches activos, sin esperar</p>
        </span>
      </button>
    `;
  }

  html += `<div class="tab-row"><span class="tab-item">🛟 Mis switches</span></div>`;

  if (switches.length === 0) {
    html += `
      <div class="empty-state">
        <span class="icon">🛟</span>
        <p>Todavía no tenés ningún switch activo.<br>Creá el primero para empezar.</p>
        <a class="btn btn-primary" style="width:auto; display:inline-flex; margin-top:8px;" href="create-switch.html">+ Crear switch</a>
      </div>`;
  } else {
    html += switches.map(cardFor).join("");
    html += `
      <div class="demo-banner" style="margin-top:18px;">
        <strong>DEMO</strong> Los datos de este prototipo viven en tu navegador (localStorage). Podés
        <a href="#" onclick="doReset(event)">reiniciar los datos de ejemplo</a> en cualquier momento.
      </div>
    `;
  }

  main.innerHTML = html;

  const panicBtn = qs("#panic-hero-btn");
  if (panicBtn) panicBtn.onclick = globalPanic;
}

function globalPanic() {
  const active = getSwitches().filter((s) => !s.off && switchStatus(s) !== "triggered");
  if (active.length === 0) {
    showToast("No tenés switches activos para avisar");
    return;
  }
  const label = active.length === 1 ? `"${active[0].name}"` : `tus ${active.length} switches activos`;
  const ok = confirm(
    `¿Avisar a tus contactos AHORA en ${label}?\n\nSe salta cualquier espera y dispara la alerta ya. ` +
    `(Prototipo: no se envía nada real.)`
  );
  if (!ok) return;

  active.forEach((sw) => {
    const windowMs = sw.mode === "legado" ? (sw.graceMs || 24 * HOUR) : (sw.alarmMs || 90000);
    sw.nextDue = Date.now() - (windowMs + 1000);
    saveSwitch(sw);
    addHistory({ switchId: sw.id, type: "trigger_manual", note: "Botón de pánico activado desde Inicio" });
  });

  render();
  showToast("Alerta enviada a tus contactos (simulado)");
}

function cardFor(sw) {
  const status = switchStatus(sw);
  const meta = statusMeta(status);
  const modeLabel = sw.mode === "legado" ? "Modo Legado" : "Modo Sesión";
  const timeLabel = status === "off"
    ? "Apagado"
    : status === "triggered"
      ? "Alerta ya enviada"
      : (sw.nextDue > Date.now()
          ? `Próximo check-in en ${formatDuration(sw.nextDue - Date.now())}`
          : `Venció hace ${formatDuration(Date.now() - sw.nextDue)}`);

  return `
    <a class="card card-tap" href="checkin.html?id=${sw.id}">
      <div class="card-row">
        <span class="dot ${meta.dot}" style="width:12px;height:12px;"></span>
        <div class="flex-1">
          <div style="font-weight:700; font-size:15px;">${sw.name}</div>
          <div class="text-sm muted">${timeLabel}</div>
        </div>
        <span class="badge badge-primary">${modeLabel}</span>
      </div>
    </a>
  `;
}

function doReset(e) {
  e.preventDefault();
  if (confirm("¿Reiniciar todos los datos de ejemplo del prototipo?")) {
    resetDB();
    render();
    showToast("Datos de ejemplo reiniciados");
  }
}

render();
</script>
</body>
</html>
