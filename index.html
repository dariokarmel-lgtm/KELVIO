<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inicio — KALVIO</title>
<link rel="icon" type="image/png" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">
<div class="phone">

  <header class="app-header app-header-home">
    <a class="gear-link home-gear" href="settings.html" data-i18n-attr="aria-label:aria.settings">⚙️</a>
    <div class="hero-brand">
      <img class="brand-icon-hero" src="img/kalvio-icon-256.png" alt="KALVIO" />
      <h1>KALVIO</h1>
      <span class="subtitle" data-i18n="brand.tagline">Safety switch &amp; panic button</span>
    </div>
  </header>

  <main class="app-main" id="main"></main>

  <div class="panic-dock" id="panic-dock" style="display:none;"></div>

  <button class="fab" id="fab-new" title="" onclick="location.href='create-switch.html'">+</button>

  <nav class="bottom-nav">
    <a data-nav="home" href="index.html"><span class="icon">🏠</span><span data-i18n="nav.home">Inicio</span></a>
    <a data-nav="recipients" href="recipients.html"><span class="icon">👥</span><span data-i18n="nav.recipients">Destinatarios</span></a>
    <a data-nav="history" href="history.html"><span class="icon">🕘</span><span data-i18n="nav.history">Historial</span></a>
    <a data-nav="settings" href="settings.html"><span class="icon">⚙️</span><span data-i18n="nav.settings">Ajustes</span></a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function render() {
  const switches = getSwitches();
  const main = qs("#main");
  const dock = qs("#panic-dock");
  const fab = qs("#fab-new");
  const notOffSwitches = switches.filter((s) => !s.off);
  const activeSwitches = switches.filter((s) => switchStatus(s) === "active");

  fab.title = t("home.fab_new_switch");

  if (notOffSwitches.length > 0) {
    dock.style.display = "flex";
    main.classList.add("with-panic-dock");
    fab.classList.add("fab-above-dock");
    dock.innerHTML = `
      <button class="panic-round" id="panic-hero-btn">
        <span class="panic-icon">🚨</span>
      </button>
      <div class="panic-dock-text">
        <p class="panic-title">${t("home.panic_title")}</p>
        <p class="panic-sub">${t("home.panic_sub")}</p>
      </div>
    `;
    qs("#panic-hero-btn", dock).onclick = globalPanic;
  } else {
    dock.style.display = "none";
    main.classList.remove("with-panic-dock");
    fab.classList.remove("fab-above-dock");
  }

  let html = "";

  html += `<div class="tab-row"><span class="tab-item">${t("home.tab_my_switches")}</span></div>`;

  if (switches.length === 0) {
    html += `
      <div class="empty-state">
        <span class="icon">🛟</span>
        <p>${t("home.empty_line1")}<br>${t("home.empty_line2")}</p>
        <a class="btn btn-primary" style="width:auto; display:inline-flex; margin-top:8px;" href="create-switch.html">${t("common.create_switch_btn")}</a>
      </div>`;
  } else if (activeSwitches.length === 0) {
    html += `
      <div class="empty-state">
        <span class="icon">🕘</span>
        <p>${t("home.no_active_title")}</p>
        <a class="btn btn-secondary" style="width:auto; display:inline-flex; margin-top:8px;" href="history.html">${t("home.no_active_link")}</a>
      </div>`;
  } else {
    html += activeSwitches.map(cardFor).join("");
  }

  main.innerHTML = html;
}

async function globalPanic() {
  const active = getSwitches().filter((s) => !s.off && switchStatus(s) !== "triggered");
  if (active.length === 0) {
    showToast(t("home.toast_no_active"));
    return;
  }
  const ok = active.length === 1
    ? confirm(t("home.panic_confirm_single", { name: active[0].name }))
    : confirm(t("home.panic_confirm_multi", { count: active.length }));
  if (!ok) return;

  showToast(t("home.toast_sending"));
  let anyError = false;
  for (const sw of active) {
    try {
      await callFunction("send-alert", { switchId: sw.id });
    } catch (e) {
      anyError = true;
      console.error(e);
    }
  }

  await loadAll();
  render();
  showToast(anyError ? t("home.toast_alert_error") : t("home.toast_alert_sent"));
}

function cardFor(sw) {
  const meta = statusMeta("active");
  const timeLabel = t("home.next_checkin_in", { time: formatDuration(sw.nextDue - Date.now()) });

  return `
    <a class="card card-tap" href="checkin.html?id=${sw.id}">
      <div class="card-row">
        <span class="dot ${meta.dot}" style="width:12px;height:12px;"></span>
        <div class="flex-1">
          <div style="font-weight:700; font-size:15px;">${sw.name}</div>
          <div class="text-sm muted">${timeLabel}</div>
        </div>
        <span class="badge badge-primary">${modeLabel(sw.mode)}</span>
      </div>
    </a>
  `;
}

(async function boot() {
  const session = await requireSession();
  if (!session) return;
  await loadAll();
  render();
})();
</script>
</body>
</html>
